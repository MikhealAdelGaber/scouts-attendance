<h2 mat-dialog-title>
  <mat-icon style="vertical-align:middle;margin-right:8px">lock_reset</mat-icon>
  Change Password — {{ data.user.username }}
</h2>

<mat-dialog-content style="min-width:360px;padding-top:8px">
  <form [formGroup]="form">

    <mat-form-field appearance="outline" class="full-width" style="margin-bottom:8px">
      <mat-label>New Password</mat-label>
      <input matInput [type]="hideNew ? 'password' : 'text'" formControlName="newPassword" autocomplete="new-password">
      <button mat-icon-button matSuffix type="button" (click)="hideNew = !hideNew">
        <mat-icon>{{ hideNew ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="form.get('newPassword')?.hasError('required')">Password is required</mat-error>
      <mat-error *ngIf="form.get('newPassword')?.hasError('minlength')">Minimum 8 characters</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirm Password</mat-label>
      <input matInput [type]="hideConfirm ? 'password' : 'text'" formControlName="confirmPassword" autocomplete="new-password">
      <button mat-icon-button matSuffix type="button" (click)="hideConfirm = !hideConfirm">
        <mat-icon>{{ hideConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="form.get('confirmPassword')?.hasError('required')">Please confirm the password</mat-error>
      <mat-error *ngIf="form.hasError('passwordMismatch') && !form.get('confirmPassword')?.hasError('required')">
        Passwords do not match
      </mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" style="padding:16px">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="form.invalid || saving">
    <mat-icon>save</mat-icon>
    {{ saving ? 'Saving…' : 'Change Password' }}
  </button>
</mat-dialog-actions>
