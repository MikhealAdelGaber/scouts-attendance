<h2 mat-dialog-title>
  <mat-icon>edit</mat-icon>
  Edit Permissions — {{ data.user.username }}
</h2>

<mat-dialog-content [formGroup]="form">

  <!-- Role -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Role</mat-label>
    <mat-select formControlName="role">
      <mat-option *ngFor="let r of roles" [value]="r.value">{{ r.label }}</mat-option>
    </mat-select>
    <mat-hint>Cannot assign SystemAdmin or GroupLeaderAdmin roles</mat-hint>
  </mat-form-field>

  <mat-divider class="section-divider"></mat-divider>

  <!-- Action Permissions -->
  <h3 class="section-title">Action Permissions</h3>
  <div class="permissions-grid">
    <mat-checkbox *ngFor="let p of actionPermissions" [formControlName]="p.key">
      {{ p.label }}
    </mat-checkbox>
  </div>

  <mat-divider class="section-divider"></mat-divider>

  <!-- Page Access Permissions -->
  <h3 class="section-title">Page Access</h3>
  <div class="permissions-grid">
    <mat-checkbox *ngFor="let p of pagePermissions" [formControlName]="p.key">
      {{ p.label }}
    </mat-checkbox>
  </div>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false" [disabled]="saving">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="saving || form.invalid">
    <mat-spinner *ngIf="saving" diameter="18" style="display:inline-block;margin-right:6px;"></mat-spinner>
    Save Changes
  </button>
</mat-dialog-actions>
